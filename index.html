<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Panduan Rumah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7A69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panduan Rumah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow phone column — sticky header with search + category chips, then cards grouped by household area. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EBE8; --ink:#14302A; --muted:#566C66; --line:#D2DDD9;
  --accent:#0E7A69; --accent-ink:#FFFFFF; --ok:#1C8A4C; --ok-bg:#E3F4EA; --no:#C1352A; --no-bg:#FBE7E4;
  --f-day:#1C8A4C; --f-2x:#0E7A69; --f-week:#B7791F; --f-month:#7A4FB5;
  --c-blue:#2F6FD6; --c-green:#2E9E5B; --c-yellow:#E5B417; --c-red:#D63A30; --c-grey:#8C9592; --c-white:#F7F7F3;
  --board-edge:rgba(0,0,0,.18);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1917; --surface:#162421; --sunk:#1D2E2A; --ink:#E3EEEA; --muted:#9AB0A9; --line:#2A3D38;
  --accent:#3FC0AA; --accent-ink:#06201B; --ok:#55C886; --ok-bg:#16332A; --no:#F07063; --no-bg:#3A1F1C;
  --f-day:#55C886; --f-2x:#3FC0AA; --f-week:#E0A848; --f-month:#B08BE8; --board-edge:rgba(255,255,255,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#162421; --sunk:#1D2E2A; --ink:#E3EEEA; --muted:#9AB0A9; --line:#2A3D38;
  --accent:#3FC0AA; --accent-ink:#06201B; --ok:#55C886; --ok-bg:#16332A; --no:#F07063; --no-bg:#3A1F1C;
  --f-day:#55C886; --f-2x:#3FC0AA; --f-week:#E0A848; --f-month:#B08BE8; --board-edge:rgba(255,255,255,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.zh{font-family:var(--zh)}
body.no-zh .zh{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;line-height:1.15}
.brand h1 .zh{font-weight:500;font-size:.85rem;color:var(--muted);margin-left:6px;letter-spacing:0}
.progress{font-size:.78rem;color:var(--muted);white-space:nowrap;text-align:right}
.progress b{color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:4px;width:96px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:10px 12px 10px 38px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toggle{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:0 12px;cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
nav.chips::-webkit-scrollbar{display:none}
nav.chips a{flex:none;text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;padding:6px 12px;border-radius:999px;background:var(--sunk);white-space:nowrap}
nav.chips a .zh{font-weight:400;color:var(--muted);margin-left:4px;font-size:.8rem}
nav.chips a.on{background:var(--ink);color:var(--surface)}
nav.chips a.on .zh{color:var(--surface);opacity:.75}

main .wrap{padding-block:8px 48px;display:grid;gap:8px}
section.cat{display:grid;gap:14px;padding-top:22px;scroll-margin-top:200px}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cat-head h2{margin:0;font-family:var(--display);font-size:1.45rem;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.cat-head h2 .zh{display:block;font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.cat-sub{margin:0;color:var(--muted);font-size:.92rem}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:200px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.art{background:var(--sunk);display:flex;justify-content:center;padding:14px 10px}
.art svg{width:100%;max-width:520px;height:auto;display:block}
.art text{font-family:var(--body);fill:var(--ink)}
.art .lbl-zh{font-family:var(--zh);fill:var(--muted)}
.body{padding:16px 16px 14px;display:grid;gap:12px}
.card h3{margin:0;font-family:var(--display);font-size:1.18rem;font-weight:700;line-height:1.3;text-wrap:balance}
.card h3 .zh{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin-top:2px}
.intro{margin:0}
.intro .zh, li .zh, .why .zh{display:block;font-size:.85rem;color:var(--muted);margin-top:1px}
.dd{display:grid;gap:10px}
.dd > div{border-radius:12px;padding:10px 12px}
.dd .do{background:var(--ok-bg)}
.dd .dont{background:var(--no-bg)}
.dd h4{margin:0 0 6px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dd .do h4{color:var(--ok)} .dd .dont h4{color:var(--no)}
.dd h4 .zh{letter-spacing:0;font-weight:500;text-transform:none}
.dd ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.dd li{padding-left:22px;position:relative}
.dd li::before{position:absolute;left:0;top:0;font-weight:800}
.dd .do li::before{content:"✓";color:var(--ok)}
.dd .dont li::before{content:"✕";color:var(--no)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.steps li > span{min-width:0}
.steps .zh{display:block;font-size:.85rem;color:var(--muted)}
.why{margin:0;font-size:.93rem;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink)}
.why b{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.btn{font:inherit;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.toggle:focus-visible,nav.chips a:focus-visible,.fchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.speaking{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.got{margin-left:auto}
.btn.got[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.btn svg{flex:none}

/* color legend table */
.legend{display:grid;gap:8px}
.legend .row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg)}
.legend .sw{width:44px;height:34px;border-radius:7px;border:1.5px solid var(--board-edge);position:relative}
.legend .sw::after{content:"";position:absolute;left:0;right:0;top:55%;border-top:1.5px dashed rgba(255,255,255,.55)}
.legend .row b{display:block;font-size:.98rem}
.legend .row span{font-size:.9rem;color:var(--muted)}
.legend .row .zh{display:inline;margin-left:4px}

/* schedule */
.fbar{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:.84rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.area{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.area h3{margin:0;padding:12px 16px;font-family:var(--display);font-size:1.08rem;font-weight:700;background:var(--sunk);display:flex;align-items:baseline;gap:8px}
.area h3 .zh{font-size:.85rem;font-weight:500;color:var(--muted)}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.task:first-of-type{border-top:0}
.task .t{min-width:0}
.task .t .zh{display:block;font-size:.84rem;color:var(--muted)}
.task .meta{text-align:right;display:grid;gap:3px;justify-items:end}
.badge{font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.b-day{background:var(--f-day)} .b-2x{background:var(--f-2x)} .b-week{background:var(--f-week)} .b-month{background:var(--f-month)}
:root[data-theme="dark"] .badge{color:#0B1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0B1513}}
.days{font-size:.78rem;color:var(--muted);white-space:nowrap}
.task.today{background:var(--ok-bg)}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 0}
.week .d{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.week .d:first-child{border-top:0}
.week .d b{font-size:.92rem}
.week .d.now{background:var(--ok-bg)}
.week .d.now b{color:var(--ok)}
.week .d ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:.92rem;min-width:0}
.week .d .zh{color:var(--muted);font-size:.82rem;margin-left:4px}

/* routine timeline */
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 0;position:relative}
.slot{display:grid;grid-template-columns:62px 18px 1fr;gap:8px;padding:9px 16px 9px 12px;align-items:start}
.slot time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;color:var(--accent);text-align:right;padding-top:1px}
.slot .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);margin-top:6px;position:relative}
.slot .dot::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:46px;background:var(--line);transform:translateX(-50%)}
.slot:last-child .dot::after{display:none}
.slot .what{min-width:0}
.slot .what b{display:block;font-weight:600}
.slot .what .zh{display:block;font-size:.84rem;color:var(--muted)}
.slot .what small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.slot .what a{color:var(--accent);font-weight:600}
.slot.now{background:var(--ok-bg)}
.slot.now .dot{background:var(--accent)}

.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
footer{color:var(--muted);font-size:.82rem;padding-block:8px 32px}
footer p{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* view switch */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:700;font-size:.95rem;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 6px;cursor:pointer}
.seg button .zh{font-weight:400;font-size:.8rem;margin-left:5px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.findbar{display:grid;gap:10px}
body[data-view="learn"] footer{display:none}

/* learn home */
#learnHome{padding-block:18px 48px;display:grid;gap:14px}
.lh-head h2{margin:0;font-family:var(--display);font-size:1.45rem;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.lh-head p{margin:4px 0 0;color:var(--muted)}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;cursor:pointer;width:100%}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .ti{background:var(--sunk);border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;max-width:100%}
.tile .ti svg{width:100%;height:auto}
.tile .ti text{font-family:var(--body);fill:var(--ink)}
.tile .tt{min-width:0}
.tile .tt b{display:block;font-size:1.08rem;font-family:var(--display)}
.tile .tt .zh{display:block;font-size:.85rem;color:var(--muted)}
.tile .tt small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.tile .st{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tile .st.ok{background:var(--ok-bg);color:var(--ok)}

/* lesson player */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-top{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.l-title{text-align:center;min-width:0}
.l-title b{display:block;font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.q{border-radius:2px}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.dots i.past{background:var(--accent);opacity:.45}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:inherit;font-size:1.1rem}
.iconbtn[aria-pressed="false"]{opacity:.45}
.iconbtn:focus-visible,.navbtn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.l-stage{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:6px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.slide{max-width:560px;margin:0 auto;display:grid;gap:16px;align-content:start}
.slide.in-next{animation:inNext .28s ease-out}
.slide.in-prev{animation:inPrev .28s ease-out}
@keyframes inNext{from{transform:translateX(40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inPrev{from{transform:translateX(-40px);opacity:.2}to{transform:none;opacity:1}}
.s-art{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;place-items:center}
.s-art svg{width:100%;height:auto;max-height:38vh}
.s-art text,.opt text{font-family:var(--body);fill:var(--ink)}
.s-art .lbl-zh{font-family:var(--zh);fill:var(--muted)}
.s-id{margin:0;font-size:1.35rem;line-height:1.4;font-weight:600;text-wrap:pretty}
.s-id .line{display:block;padding:6px 0;border-top:1px solid var(--line)}
.s-id .line:first-child{border-top:0}
.s-id .line time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;margin-right:8px}
.s-zh{margin:-8px 0 0;color:var(--muted);font-size:1rem;white-space:pre-line}
.qtag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--f-week);color:#fff;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;color:var(--ink);background:var(--surface);border:2.5px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center;position:relative}
.opt svg{width:100%;height:auto}
.opt .ol{font-weight:700;font-size:1.05rem}
.opt .ol .zh{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.opt.txt{min-height:110px;align-content:center}
.opt.txt .ol{font-size:1.3rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--no);background:var(--no-bg);animation:shake .35s}
.opt.ok::after,.opt.no::after{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.opt.ok::after{content:"✓";background:var(--ok)} .opt.no::after{content:"✕";background:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.s-fb{min-height:1.5em;font-weight:600;font-size:1.05rem;margin:0}
.s-fb.ok{color:var(--ok)} .s-fb.no{color:var(--no)}
.s-fb .zh{display:block;font-weight:400;font-size:.9rem;color:var(--muted)}
.end{text-align:center;justify-items:center;padding-top:24px}
.end .big{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:3rem;font-weight:800}
.end h2{margin:0;font-family:var(--display);font-size:1.8rem}
.end .score{font-size:1.15rem}
.end .score b{color:var(--accent);font-variant-numeric:tabular-nums}
.end .col{display:grid;gap:10px;width:100%;max-width:340px}
.l-nav{display:grid;grid-template-columns:1fr 52px 1.4fr;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.navbtn{font:inherit;font-weight:700;font-size:1.05rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:14px 10px;cursor:pointer}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.navbtn:disabled{opacity:.4;cursor:default}
.l-nav .iconbtn{width:52px;height:auto}
body.locked{overflow:hidden}
@media (min-width:640px){ .dd{grid-template-columns:1fr 1fr} .tiles{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">

const COL = k => `var(--c-${k})`;

function cloth(x,y,k,s=1){
  const w=56*s,h=44*s;
  return `<g transform="translate(${x},${y})"><rect width="${w}" height="${h}" rx="${7*s}" fill="${COL(k)}" stroke="var(--board-edge)" stroke-width="1.5"/>
  <path d="M${6*s} ${h*.58} H${w-6*s}" stroke="${k==='white'?'rgba(0,0,0,.18)':'rgba(255,255,255,.55)'}" stroke-width="1.5" stroke-dasharray="4 3"/>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

let done = new Set(store.get("pr-done",[]));

function speakText(c){
  const parts=[c.t+"."];
  if(c.intro) parts.push(c.intro[0]);
  if(c.legend) CLOTHS.forEach(x=>parts.push(`Lap ${x.id}: ${x.where}.`));
  if(c.boards) BOARDS.forEach(x=>parts.push(`Talenan ${x.id}: ${x.what}.`));
  if(c.steps) c.steps.forEach((s,i)=>parts.push(`${i+1}. ${s[0]}.`));
  if(c.do) parts.push("Boleh: "+c.do.map(x=>x[0]).join(". ")+".");
  if(c.dont) parts.push("Jangan: "+c.dont.map(x=>x[0]).join(". ")+".");
  if(c.why) parts.push("Kenapa? "+c.why[0]);
  return parts.join(" ");
}
function waText(c){
  const L=[`*${c.t}*`, c.zh];
  if(c.intro) L.push(c.intro[0]);
  if(c.legend) CLOTHS.forEach(x=>L.push(`• ${x.id}: ${x.where}`));
  if(c.boards) BOARDS.forEach(x=>L.push(`• ${x.id}: ${x.what}`));
  if(c.steps) c.steps.forEach((s,i)=>L.push(`${i+1}. ${s[0]}`));
  if(c.do){L.push("","✅ BOLEH:"); c.do.forEach(x=>L.push("• "+x[0]));}
  if(c.dont){L.push("","❌ JANGAN:"); c.dont.forEach(x=>L.push("• "+x[0]));}
  if(c.why){L.push("","Kenapa? "+c.why[0]);}
  return L.join("\n");
}

function todayName(){
  try{ return new Date().toLocaleDateString("id-ID",{weekday:"long",timeZone:"Asia/Jakarta"}); }catch(e){ return DAYS[(new Date().getDay()+6)%7]; }
}
function isFirstSaturday(){ try{ const d=+new Date().toLocaleDateString("en-US",{day:"numeric",timeZone:"Asia/Jakarta"}); return todayName()==="Sabtu" && d<=7; }catch(e){return false} }
function taskToday(t){ const [, , f, days]=t; const td=todayName(); return f==="d" || (days&&days.includes(td)) || (f==="m"&&isFirstSaturday()); }

function weekPlan(){
  const byDay={}; DAYS.forEach(d=>byDay[d]=[]);
  AREAS.forEach(a=>a.tasks.forEach(t=>{ if(t[3]) t[3].forEach(d=>byDay[d].push([t[0].replace(/ \(.*\)/,"")+" — "+a.id, t[1].replace(/（.*）/,"")+"·"+a.zh])); }));
  byDay["Sabtu"].push(["Sabtu pertama tiap bulan: semua tugas bulanan","每月第一个周六：所有每月任务"]);
  byDay["Minggu"].push(["Libur / tugas ringan sesuai kesepakatan","休息或按约定做轻活"]);
  return byDay;
}

function markNow(){
  let mins; try{ const p=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Jakarta"}).split(":"); mins=+p[0]*60+ +p[1]; }catch(e){ const d=new Date(); mins=d.getHours()*60+d.getMinutes(); }
  let cur=-1; ROUTINE.forEach((r,i)=>{const [h,m]=r[0].split(":").map(Number); if(h*60+m<=mins) cur=i;});
  document.querySelectorAll(".slot").forEach(s=>s.classList.toggle("now", +s.dataset.i===cur));

/* ---------- speech ---------- */
let speakingBtn=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>/^id[-_]/i.test(v.lang)) || vs.find(v=>/indonesia/i.test(v.name)); }
function speak(text,btn){
  if(!("speechSynthesis" in window)){ toast("HP ini tidak mendukung suara. · 此设备不支持朗读"); return; }
  if(speakingBtn===btn){ speechSynthesis.cancel(); stopSpeak(); return; }
  speechSynthesis.cancel(); stopSpeak();
  const u=new SpeechSynthesisUtterance(text); u.lang="id-ID"; u.rate=.92;
  const v=pickVoice(); if(v) u.voice=v; else toast("Suara Bahasa Indonesia belum terpasang. Pasang di Pengaturan HP.");
  u.onend=u.onerror=stopSpeak;
  speakingBtn=btn; btn.classList.add("speaking"); btn.querySelector("span").dataset.old=btn.querySelector("span").textContent; btn.querySelector("span").textContent="Berhenti";
  speechSynthesis.speak(u);
}
function stopSpeak(){ if(speakingBtn){ const s=speakingBtn.querySelector("span"); s.textContent=s.dataset.old||s.textContent; speakingBtn.classList.remove("speaking"); speakingBtn=null; } }
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const sp=e.target.closest("[data-speak]");
  if(sp){ const id=sp.dataset.speak; let text;
    if(id==="__routine") text="Rutinitas harian. "+ROUTINE.map(r=>`Jam ${r[0].replace(":"," ")}. ${r[1]}.`).join(" ");
    else if(id==="__today"){ const items=[]; AREAS.forEach(a=>a.tasks.forEach(t=>{ if(taskToday(t)) items.push(`${a.id}: ${t[0].replace(/ \(.*\)/,"")}`); })); text=`Tugas hari ini, hari ${todayName()}. `+items.join(". ")+"."; }
    else text=speakText(CARDS.find(c=>c.id===id));
    speak(text,sp); return; }
  const g=e.target.closest("[data-got]");
  if(g){ const id=g.dataset.got; if(done.has(id)) done.delete(id); else { done.add(id); toast("Bagus! Ditandai sudah paham."); }
    store.set("pr-done",[...done]); g.setAttribute("aria-pressed",done.has(id)); g.querySelector("span").textContent=done.has(id)?"Sudah paham":"Saya paham"; updateProgress(); return; }
  const f=e.target.closest("[data-f]");
  if(f){ document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b===f)); applyFreq(f.dataset.f); return; }
});
function applyFreq(k){
  document.querySelectorAll(".task").forEach(t=>{ t.dataset.fhide = (k==="all"||(k==="today"?t.dataset.today==="true":t.dataset.freq===k)) ? "" : "1"; });
  applyVisibility();
}
function applyVisibility(){
  const q=$("#q").value.trim().toLowerCase();
  const terms=q.split(/\s+/).filter(Boolean);
  const match=el=>!terms.length || terms.every(w=>el.dataset.search.includes(w));
  let any=false;
  document.querySelectorAll("section.cat").forEach(sec=>{
    let vis=0;
    sec.querySelectorAll(".card").forEach(c=>{const m=match(c); c.hidden=!m; if(m) vis++;});
    sec.querySelectorAll(".area").forEach(a=>{ let av=0; a.querySelectorAll(".task").forEach(t=>{ const m=match(t)&&!t.dataset.fhide; t.hidden=!m; if(m) av++; }); a.hidden=!av; vis+=av; });
    const wk=sec.querySelector(".week"); if(wk){ const m=match(wk); wk.hidden=!m; if(m) vis++; }
    sec.querySelectorAll(".slot").forEach(s=>{const m=match(s); s.hidden=!m; if(m) vis++;});
    sec.querySelectorAll(".timeline").forEach(t=>t.hidden=!t.querySelector(".slot:not([hidden])"));
    sec.querySelectorAll(":scope > .cat-head ~ .cat-head, :scope > .cat-head ~ .actions").forEach(x=>x.hidden=!!terms.length);
    sec.hidden=!vis; if(vis) any=true;
  });
  $("#empty").hidden=any;
}
$("#q").addEventListener("input",applyVisibility);

    Q(["Mau potong ayam mentah. Yang mana benar?","要切生鸡肉，哪个对？"],[{art:()=>O.kit("green","veg","meat"),l:["Hijau + pisau sayur","绿板 + 菜刀"]},{art:()=>O.kit("red","meat","meat"),l:["Merah + pisau daging","红板 + 肉刀"],ok:1}],["Daging dan ayam mentah: talenan merah dan pisau daging.","生肉生鸡：红板加肉刀。"]),
    Q(["Ayam goreng sudah matang. Dipotong di mana?","炸鸡已经熟了，在哪切？"],[{art:()=>O.kit("yellow","cooked","cooked"),l:["Kuning","黄板"],ok:1},{art:()=>O.kit("red","meat","cooked"),l:["Merah","红板"]}],["Makanan matang di talenan kuning. Talenan merah untuk yang mentah saja.","熟食用黄板，红板只切生的。"]),
  ]},
  {id:"jemur", t:"Mencuci & Menjemur", zh:"洗衣与晾晒", icon:()=>O.out(), slides:[
    S(()=>ART.sortLaundry(),"Sebelum mencuci, pisahkan: putih, warna, pakaian dalam, handuk, pakaian anak.","洗之前先分：白色、彩色、内衣、毛巾、孩子衣服。"),
    S(()=>ART.sunny(),"Cerah: jemur di halaman belakang. Pakaian gelap dibalik.","晴天：晾在后院，深色衣服翻面晾。"),
    S(()=>ART.rainy(),"Hujan atau mendung: jemur di dalam rumah, dekat jendela, nyalakan kipas.","雨天或阴天：晾在室内靠窗，开风扇。"),
    S(()=>O.inside(),"Tiba-tiba hujan? Langsung angkat semua jemuran. Jangan tunggu hujan berhenti.","突然下雨：马上把衣服全部收进来，不要等雨停。"),
    S(()=>ART.underwear(),"Pakaian dalam dan kaus kaki dijemur di jemuran kecil sendiri, di dalam.","内衣袜子用单独的小架子，晾在室内。"),
    S(()=>A.clock("15:30"),"Angkat semua jemuran paling lambat jam 15.30.","最晚下午3点半把衣服全部收回。"),
    Q(["Pagi ini mendung. Jemur di mana?","今天早上阴天，晾在哪？"],[{art:()=>O.out(),l:["Di luar","室外"]},{art:()=>O.inside(),l:["Di dalam","室内"],ok:1}],["Mendung atau hujan: jemur di dalam rumah.","阴天或下雨：晾在室内。"]),
    Q(["Pakaian dalam dijemur bagaimana?","内衣怎么晾？"],[{art:()=>O.underSep(),l:["Jemuran sendiri","单独晾"],ok:1},{art:()=>O.underMix(),l:["Campur handuk","和毛巾混晾"]}],["Pakaian dalam selalu dijemur terpisah.","内衣一定要单独晾。"]),
    Q(["Jemuran harus diangkat paling lambat jam berapa?","衣服最晚几点收？"],[{l:["15.30","下午3点半"],ok:1},{l:["18.00","晚上6点"]}],["Paling lambat jam 15.30.","最晚下午3点半。"]),
  ]},
  {id:"jadwal", t:"Jadwal Bersih", zh:"清洁频率", icon:()=>A.cal("Senin","周一"), slides:[
    S(()=>A.cal("Setiap hari","每天"),"Setiap hari: "+uniq(daily,0).join(", ").toLowerCase()+".","每天："+uniq(daily,1).join("、")+"。"),
    ...DAYS.filter(d=>week[d].length).map(d=>S(()=>A.cal(d,DAYS_ZH[d]),`${d}: `+week[d].map(x=>x[0]).join("; ")+".", `${DAYS_ZH[d]}：`+week[d].map(x=>x[1]).join("；"))),
    S(()=>A.cal("Sabtu ke-1","每月第一个周六"),"Sebulan sekali: "+monthly.map(t=>t[0].replace(/ \(.*\)/,"")).join(", ").toLowerCase()+".","每月一次："+monthly.map(t=>t[1]).join("、")),
    Q(["Ganti sprei hari apa?","哪天换床单？"],[{l:["Senin","周一"],ok:1},{l:["Jumat","周五"]}],["Sprei diganti setiap Senin.","每周一换床单。"]),
    Q(["Sapu dan pel lantai berapa kali?","扫地拖地多久一次？"],[{l:["Seminggu sekali","每周一次"]},{l:["Setiap hari","每天"],ok:1}],["Lantai disapu dan dipel setiap hari.","地面每天扫、每天拖。"]),
    Q(["Lap kaca jendela hari apa?","哪天擦窗户？"],[{l:["Rabu","周三"],ok:1},{l:["Minggu","周日"]}],["Kaca jendela setiap Rabu, pakai lap putih.","每周三擦窗户，用白色布。"]),
  ]},
  {id:"rutin", t:"Rutinitas Harian", zh:"每日作息", icon:()=>A.clock("06:00"), slides:[
    {art:()=>A.clock("06:00"),t:rl(R(0,3)),lines:true},
    {art:()=>A.clock("08:30"),t:rl(R(4,6)),lines:true},
    {art:()=>A.clock("11:00"),t:rl(R(7,10)),lines:true},
    {art:()=>A.clock("15:30"),t:rl(R(11,12)),lines:true},
    {art:()=>A.clock("18:00"),t:rl(R(13,14)),lines:true},
    Q(["Jam berapa angkat jemuran?","几点收衣服？"],[{l:["15.30","下午3点半"],ok:1},{l:["18.00","晚上6点"]}],["Jam 15.30 angkat jemuran, lalu lipat dan setrika.","3点半收衣服，然后叠好熨好。"]),
    Q(["Kapan mencuci semua lap?","什么时候洗抹布？"],[{l:["Besok pagi","第二天早上"]},{l:["Sore, setelah kerja","傍晚干完活后"],ok:1}],["Setiap sore jam 19.30, setelah semua pekerjaan selesai.","每天傍晚7点半，干完活后洗。"]),
  ]},
  ];
}
let LESSONS=[];
let lprog=store.get("pr-lessons",{});
let voiceOn=store.get("pr-voice",true);

function renderLearnHome(){
  LESSONS=buildLessons();
  $("#learnHome").innerHTML=`<div class="lh-head"><h2>Belajar langkah demi langkah</h2><p>Pilih topik. Geser untuk pindah halaman. Ada suara dan kuis di akhir.<span class="zh" style="display:block">选择主题，左右滑动翻页，每页自动朗读，最后有小测验。</span></p></div>
  <div class="tiles">${LESSONS.map(l=>{const p=lprog[l.id];const n=l.slides.filter(s=>!s.quiz).length,q=l.slides.filter(s=>s.quiz).length;
    return `<button class="tile" data-lesson="${l.id}"><span class="ti">${l.icon()}</span><span class="tt"><b>${esc(l.t)}</b><span class="zh">${esc(l.zh)}</span><small>${n} halaman · ${q} kuis</small></span><span class="st${p?" ok":""}">${p?`✓ ${p.best}/${p.total}`:"Mulai"}</span></button>`;}).join("")}</div>`;
}

let L=null;
const lessonEl=$("#lesson");
function openLesson(id){
  const lesson=LESSONS.find(l=>l.id===id); if(!lesson) return false;
  L={lesson,i:0,first:{},solved:{}};
  lessonEl.hidden=false; document.body.classList.add("locked");
  $("#lTitle").textContent=lesson.t;
  $("#lVoice").setAttribute("aria-pressed",voiceOn);
  showSlide(0,0); $("#lNext").focus({preventScroll:true});
  return true;
}
function closeLesson(){ if(!L) return; L=null; lessonEl.hidden=true; document.body.classList.remove("locked"); try{speechSynthesis.cancel()}catch(e){} renderLearnHome(); }
const slidesOf=()=>[...L.lesson.slides,{end:true}];
function slideSpeech(s){
  if(s.quiz) return "Kuis. "+s.q[0];
  if(s.lines) return s.t[0].split("\n").map(x=>{const [t,w]=x.split("|");return `Jam ${t.replace(":"," ")}. ${w}.`}).join(" ");
  if(s.end) return "Selesai! Bagus sekali.";
  return s.t[0];
}
function showSlide(i,dir){
  const all=slidesOf(); L.i=i; const s=all[i];
  let h="";
  if(s.end){
    const qs=L.lesson.slides.filter(x=>x.quiz).length;
    const score=L.lesson.slides.map((x,k)=>x.quiz&&L.first[k]===true?1:0).reduce((a,b)=>a+b,0);
    const prev=lprog[L.lesson.id]; lprog[L.lesson.id]={best:Math.max(score,prev?prev.best:0),total:qs,at:Date.now()}; store.set("pr-lessons",lprog);
    const idx=LESSONS.indexOf(L.lesson), nxt=LESSONS[idx+1];
    h=`<div class="slide end"><div class="big">✓</div><h2>Selesai!</h2><p class="score">Benar pada percobaan pertama: <b>${score}/${qs}</b><span class="zh" style="display:block;color:var(--muted)">第一次就答对：${score}/${qs}</span></p>
      <div class="col">${nxt?`<button class="navbtn primary" data-lesson="${nxt.id}">Lanjut: ${esc(nxt.t)} ›</button>`:""}<button class="navbtn" data-restart="1">Ulangi topik ini</button><button class="navbtn" data-close="1">Kembali ke menu</button></div></div>`;
  } else if(s.quiz){
    h=`<div class="slide"><div><span class="qtag">Kuis</span><p class="s-id">${esc(s.q[0])}</p><p class="zh s-zh" style="margin-top:4px">${esc(s.q[1])}</p></div>
      <div class="opts">${s.opts.map((o,k)=>`<button class="opt${o.art?"":" txt"}" data-opt="${k}">${o.art?o.art():""}<span class="ol">${esc(o.l[0])}<span class="zh">${esc(o.l[1])}</span></span></button>`).join("")}</div>
      <p class="s-fb" id="fb" aria-live="polite"></p></div>`;
  } else {
    const idT = s.lines ? s.t[0].split("\n").map(x=>{const [t,w]=x.split("|");return `<span class="line"><time>${t}</time>${esc(w)}</span>`}).join("") : esc(s.t[0]);
    h=`<div class="slide"><div class="s-art">${s.art()}</div><div><p class="s-id">${idT}</p>${s.lines?"":`<p class="zh s-zh" style="margin-top:8px">${esc(s.t[1])}</p>`}${s.lines?`<p class="zh s-zh" style="margin-top:8px">${esc(s.t[1])}</p>`:""}</div></div>`;
  }
  const st=$("#lStage"); st.innerHTML=h; st.scrollTop=0;
  const sl=st.firstElementChild; if(dir) sl.classList.add(dir>0?"in-next":"in-prev");
  if(s.quiz && L.solved[i]) markSolved(i);
  $("#lDots").innerHTML=all.slice(0,-1).map((x,k)=>`<i class="${x.quiz?"q ":""}${k===i?"on":k<i?"past":""}"></i>`).join("");
  $("#lPrev").disabled=i===0;
  const nx=$("#lNext"); nx.hidden=!!s.end;
  nx.disabled=!!(s.quiz&&!L.solved[i]); nx.textContent=s.quiz&&!L.solved[i]?"Jawab dulu":"Lanjut ›";
  if(voiceOn) say(slideSpeech(s));
}
function markSolved(i){
  const s=slidesOf()[i]; const k=s.opts.findIndex(o=>o.ok);
  const b=document.querySelector(`[data-opt="${k}"]`); if(b) b.classList.add("ok");
  const fb=$("#fb"); if(fb){ fb.className="s-fb ok"; fb.innerHTML=`Benar! ${esc(s.ex[0])}<span class="zh">${esc(s.ex[1])}</span>`; }
}
function answer(k){
  const i=L.i, s=slidesOf()[i]; if(L.solved[i]) return;
  const o=s.opts[k], b=document.querySelector(`[data-opt="${k}"]`);
  if(L.first[i]===undefined) L.first[i]=!!o.ok;
  if(o.ok){ L.solved[i]=true; markSolved(i); const nx=$("#lNext"); nx.disabled=false; nx.textContent="Lanjut ›"; if(voiceOn) say("Benar! "+s.ex[0]); }
  else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); const fb=$("#fb"); fb.className="s-fb no"; fb.innerHTML=`Belum benar. Coba lagi.<span class="zh">不对，再试一次。</span>`; if(voiceOn) say("Belum benar. Coba lagi."); }
}
function step(d){
  if(!L) return; const all=slidesOf(), s=all[L.i];
  if(d>0){ if(s.end) return; if(s.quiz&&!L.solved[L.i]){ toast("Jawab kuis dulu · 先回答问题"); return; } }
  const j=L.i+d; if(j<0||j>=all.length) return; showSlide(j,d);
}
function say(text){
  if(!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); stopSpeak(); const u=new SpeechSynthesisUtterance(text); u.lang="id-ID"; u.rate=.9; const v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){}
}
$("#lPrev").addEventListener("click",()=>step(-1));
$("#lNext").addEventListener("click",()=>step(1));
$("#lReplay").addEventListener("click",()=>{ if(L){ if(!("speechSynthesis" in window)){toast("HP ini tidak mendukung suara. · 此设备不支持朗读");return;} say(slideSpeech(slidesOf()[L.i])); }});
$("#lVoice").addEventListener("click",e=>{ voiceOn=!voiceOn; store.set("pr-voice",voiceOn); e.currentTarget.setAttribute("aria-pressed",voiceOn); if(!voiceOn) try{speechSynthesis.cancel()}catch(_){} toast(voiceOn?"Suara otomatis: nyala · 自动朗读：开":"Suara otomatis: mati · 自动朗读：关"); });
$("#lClose").addEventListener("click",()=>{ location.hash="#belajar"; });
lessonEl.addEventListener("click",e=>{
  const o=e.target.closest("[data-opt]"); if(o){ answer(+o.dataset.opt); return; }
  if(e.target.closest("[data-restart]")){ openLesson(L.lesson.id); return; }
  if(e.target.closest("[data-close]")){ location.hash="#belajar"; return; }
});
let sx=null,sy=0;
$("#lStage").addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; sx=e.clientX; sy=e.clientY; });
$("#lStage").addEventListener("pointerup",e=>{ if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3) step(dx<0?1:-1); });
$("#lStage").addEventListener("pointercancel",()=>{sx=null});
document.addEventListener("keydown",e=>{ if(!L) return; if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1); else if(e.key==="Escape") location.hash="#belajar"; });
document.addEventListener("click",e=>{ const t=e.target.closest(".tile[data-lesson], .end [data-lesson]"); if(t){ location.hash="#belajar-"+t.dataset.lesson; } });

/* ===================== VIEWS & ROUTING ===================== */
function setView(v){
  document.body.dataset.view=v; store.set("pr-view",v);
  $("#findBar").hidden=v!=="find"; $("#learnHome").hidden=v!=="learn"; $("#content").hidden=v!=="find";
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{ const h=b.dataset.view==="learn"?"#belajar":"#cari"; if(location.hash===h) route(); else location.hash=h; window.scrollTo(0,0); }));
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("belajar-")){ setView("learn"); if(!L||L.lesson.id!==h.slice(8)) openLesson(h.slice(8)); return; }
  closeLesson();
  if(h==="belajar"){ setView("learn"); return; }
  if(h==="cari"){ setView("find"); spy(); return; }
  if(h && document.getElementById(h) && $("#content").contains(document.getElementById(h))){ setView("find"); setTimeout(()=>goHash(h),30); return; }
  setView(store.get("pr-view","learn"));
}
window.addEventListener("hashchange",route);

/* chip highlight on scroll */
function spy(){
  if(document.body.dataset.view!=="find") return;
  let cur=CATS[0].id; const off=170;
  CATS.forEach(c=>{const s=document.getElementById(c.id); if(s&&!s.hidden&&s.getBoundingClientRect().top-off<=0) cur=c.id;});
  document.querySelectorAll("#chips a").forEach(a=>{ const on=a.dataset.cat===cur; if(on&&!a.classList.contains("on")) a.scrollIntoView({inline:"center",block:"nearest"}); a.classList.toggle("on",on); });
}
window.addEventListener("scroll",spy,{passive:true});

render();
setZh(store.get("pr-zh",true));
route();
spy();
setInterval(markNow,60000);

/* offline support (works on the GitHub Pages copy; skipped where service workers are unavailable) */
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
